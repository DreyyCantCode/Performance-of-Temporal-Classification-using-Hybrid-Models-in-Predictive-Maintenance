<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting to Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="./Front%20End/favicon.svg" />
    <meta http-equiv="refresh" content="0; url=http://127.0.0.1:5000/" />
    <script>
        window.location.replace('http://127.0.0.1:5000/');
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
            background: #0f172a;
            color: #e2e8f0;
        }
        a { color: #38bdf8; }
    </style>
</head>
<body>
    <div>
        <h1>Opening dashboard…</h1>
        <p>If you are not redirected automatically, <a href="http://127.0.0.1:5000/">open the dashboard here</a>.</p>
    </div>
</body>
</html>
